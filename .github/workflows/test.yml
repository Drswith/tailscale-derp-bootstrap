name: Linux compatibility

on:
  push:
    branches: [main]
  pull_request:

jobs:
  distro:
    name: ${{ matrix.name }} compatibility checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { name: Ubuntu 22.04, image: 'ubuntu:22.04', id: ubuntu, major: '22' }
          - { name: Ubuntu 24.04, image: 'ubuntu:24.04', id: ubuntu, major: '24' }
          - { name: Debian 12, image: 'debian:12', id: debian, major: '12' }
          - { name: Debian 13, image: 'debian:13', id: debian, major: '13' }
          - { name: CentOS Stream 9, image: 'quay.io/centos/centos:stream9', id: centos, major: '9' }
          - { name: CentOS Stream 10, image: 'quay.io/centos/centos:stream10', id: centos, major: '10' }
    steps:
      - uses: actions/checkout@v4
      - name: Run installer commands and build derper in the distribution container
        shell: bash
        env:
          DISTRO_IMAGE: ${{ matrix.image }}
          EXPECTED_ID: ${{ matrix.id }}
          EXPECTED_MAJOR: ${{ matrix.major }}
        run: |
          docker run --rm --platform linux/amd64 \
            --env EXPECTED_ID --env EXPECTED_MAJOR \
            --volume "$GITHUB_WORKSPACE:/src:ro" --workdir /src \
            "$DISTRO_IMAGE" bash tests/distro-compat.sh

  docker-image:
    name: Build the Docker deployment image
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the locked amd64 image and inspect bundled binaries
        shell: bash
        run: |
          source versions.lock
          docker build --platform linux/amd64 -f docker/Dockerfile \
            --build-arg GO_VERSION="$GO_VERSION" \
            --build-arg TAILSCALE_VERSION="$TAILSCALE_VERSION" \
            --build-arg CERTBOT_VERSION="$CERTBOT_VERSION" \
            -t "derp-bootstrap-ci:$TAILSCALE_VERSION" .
          docker run --rm --entrypoint /usr/local/bin/tailscaled \
            "derp-bootstrap-ci:$TAILSCALE_VERSION" --version |
            grep -Fx "$TAILSCALE_VERSION"
          docker run --rm --entrypoint /usr/local/bin/derper \
            "derp-bootstrap-ci:$TAILSCALE_VERSION" -version |
            grep -F "$TAILSCALE_VERSION"
